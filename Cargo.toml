[workspace]
resolver = "3"
members = [
  "crates/lk-crypto",
  "crates/lk-core",
  "crates/lk-generator",
  "crates/lk-totp",
  "crates/lk-vault",
  "crates/lk-store",
  "crates/lk-auth",
  "crates/lk-protocol",
  "crates/lk-sync",
  "crates/lk-client",
  "crates/lk-autofill",
  "crates/lk-bridge",
  "apps/cli",
  "apps/server",
  "apps/desktop/src-tauri",
]
# Fuzz targets need a nightly toolchain and live in their own workspace.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Kept equal to the pinned toolchain (rust-toolchain.toml): it is the only
# compiler version this workspace is tested with.
rust-version = "1.97"
license = "LicenseRef-LastKeys-Proprietary"
publish = false

# Every dependency is declared once, here, with an explicit version.
# Exact resolution is pinned by the committed Cargo.lock and CI builds with
# `--locked`. See docs/adr/0003-dependency-policy.md before adding anything.
[workspace.dependencies]
lk-crypto = { path = "crates/lk-crypto" }
lk-core = { path = "crates/lk-core" }
lk-generator = { path = "crates/lk-generator" }
lk-totp = { path = "crates/lk-totp" }
lk-vault = { path = "crates/lk-vault" }
lk-store = { path = "crates/lk-store" }
lk-auth = { path = "crates/lk-auth" }
lk-protocol = { path = "crates/lk-protocol" }
lk-sync = { path = "crates/lk-sync" }
lk-client = { path = "crates/lk-client" }
lk-autofill = { path = "crates/lk-autofill" }
lk-bridge = { path = "crates/lk-bridge" }

# Cryptography (RustCrypto / dalek / rust-hpke). No custom primitives.
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
hkdf = { version = "0.13.0", default-features = false }
sha2 = { version = "0.11.1", default-features = false }
# HOTP/TOTP only (RFC 4226/6238 mandate HMAC-SHA1 compatibility); never used
# for anything else.
sha1 = { version = "0.11.0", default-features = false }
hmac = { version = "0.13.0", default-features = false }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["fast", "zeroize", "alloc"] }
hpke = { version = "0.15.1", default-features = false, features = ["alloc", "x25519", "chacha", "getrandom"] }
getrandom = { version = "0.4.3", default-features = false }
zeroize = { version = "1.9.2", default-features = false, features = ["alloc", "derive"] }
subtle = { version = "2.6.1", default-features = false }

# OPAQUE (ADR-0005). opaque-ke 4 is built on the previous RustCrypto
# generation, hence the pinned legacy `sha2`/`rand_core` used only by lk-auth.
opaque-ke = { version = "4.0.1", default-features = false, features = ["ristretto255", "std"] }
sha2-legacy = { package = "sha2", version = "0.10.9", default-features = false }
rand-core-legacy = { package = "rand_core", version = "0.6.4", default-features = false, features = ["getrandom"] }

# Encoding / text
data-encoding = { version = "2.11.1", default-features = false, features = ["alloc"] }
unicode-normalization = { version = "0.1.26", default-features = false }
url = { version = "2.5.9" }
percent-encoding = { version = "2.3.2" }
# Public Suffix List compiled into code (list data under MPL-2.0, see NOTICE);
# pinned exactly: each release embeds a new snapshot of the list.
psl = { version = "=2.1.252" }
idna = { version = "1.1.0" }

# General
thiserror = { version = "2.0.21", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0.154", default-features = false, features = ["alloc"] }
uuid = { version = "1.29.3", default-features = false, features = ["serde"] }

# Local storage: SQLite compiled from the bundled amalgamation (same version
# on every platform, no dependency on the system library).
rusqlite = { version = "0.43.0", default-features = false, features = ["bundled"] }

# Desktop only (ADR-0010)
tauri = { version = "=2.12.5" }
tauri-build = { version = "=2.7.4" }
arboard = { version = "3.7.0", default-features = false }
# Per-user directories (already used by Tauri); the browser bridge needs them
# before Tauri starts (relay mode, ADR-0011).
dirs = { version = "7.0.0" }

# Server only (ADR-0009)
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
axum = { version = "0.8.9" }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace", "timeout"] }
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "uuid", "json"] }
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }

# HTTP client of native apps: rustls with the operating system's trust store.
ureq = { version = "3.5.2", default-features = false, features = ["rustls", "platform-verifier", "json"] }

# Command-line client only
clap = { version = "4.6.10", features = ["derive"] }
rpassword = { version = "7.5.5" }

# Test-only
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
tempfile = { version = "3.27.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mem_forget = "deny"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"
cast_possible_truncation = "warn"

# Optimize dependencies (Argon2, ChaCha20, curve arithmetic) in dev and test
# builds: debug-mode Argon2id with production parameters takes tens of seconds.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
# Security-relevant: abort instead of unwinding so a panic can never leave
# partially-initialised secret state reachable by a caller's catch_unwind.
panic = "abort"
lto = "thin"
codegen-units = 1
