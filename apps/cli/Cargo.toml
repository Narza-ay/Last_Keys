[package]
name = "lk-cli"
description = "lk — Last Keys command-line client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "lk"
path = "src/main.rs"

[dependencies]
lk-client.workspace = true
lk-crypto.workspace = true
lk-generator.workspace = true
lk-vault.workspace = true
lk-sync.workspace = true
clap.workspace = true
rpassword.workspace = true

[features]
# End-to-end tests against a real server and PostgreSQL
# (needs LK_TEST_DATABASE_URL; run in the CI `server-tests` job).
server-e2e = []

[[test]]
name = "sync_e2e"
required-features = ["server-e2e"]

[dev-dependencies]
tempfile.workspace = true
lk-auth.workspace = true
lk-server = { path = "../server" }
tokio.workspace = true
sqlx.workspace = true
axum.workspace = true
data-encoding.workspace = true

[lints]
workspace = true
