name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  lint:
    name: Format and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # The server's integration tests need PostgreSQL: they run in the
      # `server-tests` job below, never skipped.
      - run: cargo test --workspace --locked --exclude lk-server
      - name: Release-mode tests (production optimizations, panic=abort)
        run: cargo test --workspace --locked --release --exclude lk-server

  server-tests:
    name: Server, sync and end-to-end tests (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lastkeys
          POSTGRES_PASSWORD: lastkeys-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lastkeys"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      LK_TEST_DATABASE_URL: postgres://lastkeys:lastkeys-ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p lk-server --locked
      - name: End-to-end CLI synchronization (two devices, real binary)
        run: cargo test -p lk-cli --features server-e2e --test sync_e2e --locked

  compose-smoke:
    name: Self-hosting stack (Docker Compose smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build the lk CLI
        run: cargo build --release --locked -p lk-cli
      - name: Build the server image from source
        run: docker build -f infra/Dockerfile -t lastkeys/server:local .
      - name: Setup, TLS health, register/sync, backup, wipe, restore, enroll
        run: ./scripts/compose-smoke-test.sh

  wasm:
    name: WebAssembly build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain and wasm32 target
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p lk-core -p lk-crypto -p lk-generator -p lk-totp --target wasm32-unknown-unknown --locked

  deny:
    name: Dependency policy (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  advisory-guard:
    name: Advisory exception guard (RUSTSEC-2026-0387)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/check-advisory-unlinked.sh

  docs:
    name: Rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --locked --document-private-items
