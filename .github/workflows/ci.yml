name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  lint:
    name: Format and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install WebKitGTK (desktop application, Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install WebKitGTK (desktop application, Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev
      # The server's integration tests need PostgreSQL: they run in the
      # `server-tests` job below, never skipped.
      - run: cargo test --workspace --locked --exclude lk-server
      - name: Release-mode tests (production optimizations, panic=abort)
        run: cargo test --workspace --locked --release --exclude lk-server

  server-tests:
    name: Server, sync and end-to-end tests (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lastkeys
          POSTGRES_PASSWORD: lastkeys-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lastkeys"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      LK_TEST_DATABASE_URL: postgres://lastkeys:lastkeys-ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p lk-server --locked
      - name: End-to-end CLI synchronization (two devices, real binary)
        run: cargo test -p lk-cli --features server-e2e --test sync_e2e --locked

  compose-smoke:
    name: Self-hosting stack (Docker Compose smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build the lk CLI
        run: cargo build --release --locked -p lk-cli
      - name: Build the server image from source
        run: docker build -f infra/Dockerfile -t lastkeys/server:local .
      - name: Setup, TLS health, register/sync, backup, wipe, restore, enroll
        run: ./scripts/compose-smoke-test.sh

  desktop-ui:
    name: Desktop UI (lint, types, unit and browser tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - name: Every required peer dependency is declared
        run: npm ls --all > /dev/null
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install the Chromium of the pinned Playwright
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  extension:
    name: Browser extension (lint, types, unit tests, Chromium and Firefox builds)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/extension
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/extension/package-lock.json
      - run: npm ci
      - name: Every required peer dependency is declared
        run: npm ls --all > /dev/null
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Keep the unpacked builds (Chrome/Brave, Firefox)
        uses: actions/upload-artifact@v4
        with:
          name: extension-unpacked
          path: |
            apps/extension/dist/chrome
            apps/extension/dist/firefox
          retention-days: 7

  desktop-app:
    name: Desktop application end to end (real app and server, Linux, WebDriver)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lastkeys
          POSTGRES_PASSWORD: lastkeys-ci
          POSTGRES_DB: lastkeys
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lastkeys"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            apps/extension/package-lock.json
      - name: Install WebKitGTK, its WebDriver, a virtual display and xclip
        run: |
          sudo apt-get update
          # The WebDriver package was renamed in Ubuntu 26.04.
          driver=$(apt-cache show webkitgtk-webdriver > /dev/null 2>&1 && echo webkitgtk-webdriver || echo webkit2gtk-driver)
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev "$driver" xvfb xclip
          command -v WebKitWebDriver
      - name: Install tauri-driver
        run: cargo install tauri-driver --version 2.1.0 --locked
      - name: Build the application (front end embedded)
        working-directory: apps/desktop
        run: |
          npm ci
          npx tauri build --debug --no-bundle
      - name: Start a synchronization server
        run: |
          cargo build --locked -p lk-server
          ./target/debug/lk-server generate-secret "$RUNNER_TEMP/server_secret"
          LK_DATABASE_URL=postgres://lastkeys:lastkeys-ci@localhost:5432/lastkeys \
          LK_SERVER_SECRET_FILE="$RUNNER_TEMP/server_secret" LK_BIND=127.0.0.1:18090 \
            nohup ./target/debug/lk-server serve > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:18090/v1/health && break; sleep 1; done
      - name: Create, edit, copy, register, sync, lock, restart (real Rust back end)
        working-directory: apps/desktop
        env:
          LK_E2E_SERVER: http://127.0.0.1:18090
        run: xvfb-run -a node e2e-tauri/run.mjs
      - name: Build the browser extension
        working-directory: apps/extension
        run: |
          npm ci
          npm run build
      - name: Install the Chromium of the pinned Playwright
        working-directory: apps/extension
        run: npx playwright install --with-deps chromium
      - name: Autofill end to end (real app, Chromium with the extension, native messaging)
        working-directory: apps/extension
        run: xvfb-run -a node e2e/run.mjs

  desktop-bundle:
    name: Desktop installers (${{ matrix.os }}, unsigned)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install WebKitGTK (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev
      - name: Build the installers
        working-directory: apps/desktop
        run: |
          npm ci
          npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: last-keys-${{ runner.os }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7

  wasm:
    name: WebAssembly build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain and wasm32 target
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p lk-core -p lk-crypto -p lk-generator -p lk-totp -p lk-autofill --target wasm32-unknown-unknown --locked

  deny:
    name: Dependency policy (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  advisory-guard:
    name: Advisory exception guard (RUSTSEC-2026-0387)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/check-advisory-unlinked.sh

  docs:
    name: Rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install WebKitGTK (desktop application, Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev
      - run: cargo doc --workspace --no-deps --locked --document-private-items
