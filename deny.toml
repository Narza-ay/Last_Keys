# cargo-deny policy. Run: cargo deny check
# Rationale: docs/adr/0003-dependency-policy.md

[graph]
all-features = false
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "aarch64-apple-ios",
  "aarch64-linux-android",
  "armv7-linux-androideabi",
  "x86_64-linux-android",
  "wasm32-unknown-unknown",
]

[advisories]
version = 2
# Any RustSec advisory (vulnerability, unmaintained, unsound) fails the build.
yanked = "deny"
# Every exception needs a justification that CI keeps verifying.
ignore = [
  # crypto-bigint 0.5 (via opaque-ke 4 -> elliptic-curve 0.13): timing
  # variability in bigint arithmetic. Our OPAQUE suite is Ristretto255
  # (curve25519-dalek); the affected code is not linked at all, which
  # scripts/check-advisory-unlinked.sh verifies in CI (job "advisory-guard").
  # Remove when moving to opaque-ke 5 (crypto-bigint 0.7). See ADR-0005.
  { id = "RUSTSEC-2026-0387", reason = "affected crypto-bigint code is not linked (verified in CI by scripts/check-advisory-unlinked.sh)" },
]

[licenses]
version = 2
# Last Keys is proprietary and statically links its dependencies:
# permissive licenses only, plus MPL-2.0 under the conditions below.
# Strong copyleft (GPL/LGPL/AGPL) is refused. Kept to the licenses actually
# present; adding one requires review (ADR-0003).
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-3-Clause",
  "Unicode-3.0",
  "Zlib",
  # ring, rustls-webpki, untrusted (TLS stack of the native HTTP client);
  # permissive, MIT-equivalent. Reviewed 2026-11-25.
  "ISC",
  # webpki-root-certs (Mozilla root store data, fallback of the platform
  # verifier); permissive data licence. Reviewed 2026-11-25.
  "CDLA-Permissive-2.0",
  # clipboard-win, error-code (desktop clipboard on Windows); permissive.
  # Reviewed 2026-11-25.
  "BSL-1.0",
  # target-lexicon (build time, desktop); permissive. Reviewed 2026-11-25.
  "Apache-2.0 WITH LLVM-exception",
  # option-ext, cssparser, cssparser-macros, selectors, dtoa-short (pulled
  # by Tauri/wry, no alternative). File-level weak copyleft: allowed in a
  # proprietary larger work (MPL-2.0 §3.3) as long as these files are used
  # unmodified and recipients are told where their source is (NOTICE).
  # Modifying an MPL-2.0 file is not allowed without review. 2026-11-25.
  "MPL-2.0",
]
confidence-threshold = 0.93

[licenses.private]
# Workspace crates are unpublished and proprietary.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace-internal path dependencies carry no version; they are never
# published, so this is safe.
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
