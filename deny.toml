# cargo-deny policy. Run: cargo deny check
# Rationale: docs/adr/0003-dependency-policy.md

[graph]
all-features = false
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "aarch64-apple-ios",
  "aarch64-linux-android",
  "armv7-linux-androideabi",
  "x86_64-linux-android",
  "wasm32-unknown-unknown",
]

[advisories]
version = 2
# Any RustSec advisory (vulnerability, unmaintained, unsound) fails the build.
yanked = "deny"
ignore = []

[licenses]
version = 2
# Last Keys is proprietary and statically links its dependencies:
# only permissive licenses are accepted. No copyleft (GPL/LGPL/AGPL/MPL).
# Kept to the licenses actually present; adding one requires review.
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-3-Clause",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.93

[licenses.private]
# Workspace crates are unpublished and proprietary.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace-internal path dependencies carry no version; they are never
# published, so this is safe.
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
